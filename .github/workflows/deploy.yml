name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy scope'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - frontend
          - api

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Pull latest code
        run: ssh root@${{ secrets.SERVER_IP }} "cd /opt/vigooth && git pull"

      - name: Build frontends
        if: inputs.target == 'all' || inputs.target == 'frontend' || inputs.target == ''
        run: |
          ssh root@${{ secrets.SERVER_IP }} "cd /opt/vigooth && docker compose -f docker-compose.prod.yml --profile build run --rm frontend-build"

      - name: Restart Caddy
        if: inputs.target == 'all' || inputs.target == 'frontend' || inputs.target == ''
        run: |
          ssh root@${{ secrets.SERVER_IP }} "cd /opt/vigooth && docker compose -f docker-compose.prod.yml up -d caddy --force-recreate"

      - name: Build API
        if: inputs.target == 'all' || inputs.target == 'api' || inputs.target == ''
        run: |
          ssh root@${{ secrets.SERVER_IP }} "cd /opt/vigooth && docker compose -f docker-compose.prod.yml build api"

      - name: Restart API
        if: inputs.target == 'all' || inputs.target == 'api' || inputs.target == ''
        run: |
          ssh root@${{ secrets.SERVER_IP }} "cd /opt/vigooth && docker compose -f docker-compose.prod.yml up -d api"
