<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320">
  <!-- Door frame -->
  <rect x="0" y="0" width="200" height="300" fill="#1a1a1a" stroke="#FFFF00" stroke-width="4" />

  <!-- Door body -->
  <rect x="10" y="10" width="180" height="280" fill="url(#doorGradient)" stroke="#00FF00" stroke-width="4" />

  <!-- Gradient for door -->
  <defs>
    <linearGradient id="doorGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a" />
      <stop offset="100%" stop-color="#000040" />
    </linearGradient>
  </defs>

  <!-- Single panel -->
  <rect x="26" y="26" width="148" height="248" fill="none" stroke="#00FFFF" stroke-width="2" />

  <!-- Middle divider -->
  <line x1="26" y1="150" x2="174" y2="150" stroke="#00FFFF" stroke-width="2" />

  <!-- Door handle -->
  <circle cx="170" cy="150" r="6" fill="#FFFF00" stroke="#FFFF00" stroke-width="2" />

  <!-- Texture lines -->
  <line x1="30" y1="50" x2="170" y2="50" stroke="#00FF00" stroke-width="0.5" opacity="0.3" />
  <line x1="30" y1="90" x2="170" y2="90" stroke="#00FF00" stroke-width="0.5" opacity="0.3" />
  <line x1="30" y1="130" x2="170" y2="130" stroke="#00FF00" stroke-width="0.5" opacity="0.3" />
  <line x1="30" y1="180" x2="170" y2="180" stroke="#00FF00" stroke-width="0.5" opacity="0.3" />
  <line x1="30" y1="220" x2="170" y2="220" stroke="#00FF00" stroke-width="0.5" opacity="0.3" />
  <line x1="30" y1="260" x2="170" y2="260" stroke="#00FF00" stroke-width="0.5" opacity="0.3" />

  <!-- Shine effect -->
  <rect x="10" y="10" width="180" height="280" fill="url(#shine)" />
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00FF00" stop-opacity="0" />
      <stop offset="50%" stop-color="#00FF00" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#00FF00" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Door step -->
  <rect x="0" y="300" width="200" height="8" fill="#FFFF00" stroke="#FFFF00" stroke-width="2" />
</svg>
