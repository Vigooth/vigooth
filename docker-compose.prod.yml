services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  tor:
    image: dperson/torproxy:latest
    restart: unless-stopped
    networks:
      - backend

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: '8090'
      GIN_MODE: release
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      TMDB_API_KEY: ${TMDB_API_KEY}
      OMDB_API_KEY: ${OMDB_API_KEY}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      COOKIE_DOMAIN: .${DOMAIN}
      TOR_SOCKS_ADDR: tor:9050
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      STEAM_BASE_URL: https://app-steam.${DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
      tor:
        condition: service_started
    networks:
      - backend

  frontend-build:
    image: node:20-alpine
    profiles: [build]
    working_dir: /app
    environment:
      VITE_API_URL: https://api.${DOMAIN}
      VITE_STEAM_API_KEY: ${VITE_STEAM_API_KEY}
      VITE_STEAM_ID: ${VITE_STEAM_ID}
    volumes:
      - .:/app
      - frontend_portal:/app/apps/portal/dist
      - frontend_vilock:/app/apps/vilock/dist
      - frontend_moovi:/app/apps/moovi/dist
      - frontend_steam:/app/apps/steam/dist
      - frontend_dnd:/app/apps/dnd/dist
      - pnpm_store:/app/.pnpm-store
    command: >
      sh -c "
        corepack enable &&
        corepack prepare pnpm@10.14.0 --activate &&
        rm -rf node_modules apps/*/node_modules packages/*/node_modules &&
        pnpm install --frozen-lockfile &&
        pnpm build:portal &&
        pnpm build:vilock &&
        pnpm build:moovi &&
        pnpm build:steam &&
        pnpm build:dnd
      "
    networks: []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_portal:/srv/portal:ro
      - frontend_vilock:/srv/vilock:ro
      - frontend_moovi:/srv/moovi:ro
      - frontend_steam:/srv/steam:ro
      - frontend_dnd:/srv/dnd:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - backend

volumes:
  postgres_data:
  frontend_portal:
  frontend_vilock:
  frontend_moovi:
  frontend_steam:
  frontend_dnd:
  pnpm_store:
  caddy_data:
  caddy_config:

networks:
  backend:
